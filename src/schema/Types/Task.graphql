# The common fields required for any content
interface Content {
  id: ID!
  title: String
  description: String
}

# The actual Task type with all of your Vue app's fields
type Task implements Content {
  id: ID!
  title: String
  description: String
  milestone: String @date(format: "dd/MM/yyyy")
  priority_level: String
  order_id: Int
  prev_order_id: Int
  is_done: Boolean
  is_archived: Boolean
  total_caracters: Int
}